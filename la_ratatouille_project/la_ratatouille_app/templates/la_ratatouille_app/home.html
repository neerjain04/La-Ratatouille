
{% extends "la_ratatouille_app/base.html" %}
{% block body %}
<h1>Welcome to La Ratatouille!</h1>
{% if user.is_authenticated %}
    <p>You are logged in as {{ user.username }}.</p>
{% else %}
    <p><a href="{% url 'signup' %}">Sign up</a> or <a href="{% url 'login' %}">log in</a> to manage recipes.</p>
{% endif %}
{% endblock %}
