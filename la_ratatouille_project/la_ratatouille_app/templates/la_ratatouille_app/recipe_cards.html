{# Shared recipe links and ratings for home and list pages. #}
<ul>
    {% for recipe in recipes %}
        <li>
            <a href="{% url 'recipe_detail' recipe.pk %}">{{ recipe.name }}</a>
            {% if recipe.average_rating %}({{ recipe.average_rating|floatformat:1 }} / 5){% endif %}
        </li>
    {% empty %}
        <li>No recipes to show yet.</li>
    {% endfor %}
</ul>
