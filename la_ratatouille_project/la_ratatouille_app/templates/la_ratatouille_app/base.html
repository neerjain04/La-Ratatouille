<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Ratatouille</title>
</head>
<body>
<!-- Main links change depending on whether the visitor is signed in. -->
<nav>
    <a href="{% url 'index' %}">Home</a>
    <a href="{% url 'search' %}">Search</a>
    {% if user.is_authenticated %}
        <a href="{% url 'recipe_create' %}">Add recipe</a>
        <a href="{% url 'my_recipes' %}">My recipes</a>
        <a href="{% url 'favorites' %}">Favorites</a>
        <form action="{% url 'logout' %}" method="post" style="display: inline;">
            {% csrf_token %}
            <button type="submit">Log out</button>
        </form>
    {% else %}
        <a href="{% url 'login' %}">Log in</a>
    {% endif %}
</nav>
<!-- Show feedback after actions like saving a recipe or rating. -->
{% for message in messages %}
    <p>{{ message }}</p>
{% endfor %}
{% block body %}
{% endblock %}
<footer>
    &copy; 2026 by Neer Jain, Jocelyn Jude, Aiden McCaslen, Michael McGuan, and Jenna Mohammed
</footer>
</body>
</html>
